<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111c" />
    <title>BREACHLINE — 방 찾기</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        overflow: hidden;
      }

      /* 행 높이를 화면에 묶어 둔다 — 그러지 않으면 목록이 늘어나 스크롤 대신 잘린다. */
      .layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        grid-template-rows: minmax(0, 1fr);
        width: 100vw;
        height: 100vh;
      }

      /* ---------- 왼쪽 사이드바 ---------- */

      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
        padding: 26px 22px 24px;
        border-right: 1px solid var(--line);
        background: #040d14b3;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.18em;
      }

      .brand-mark {
        color: var(--cyan);
        font-size: 18px;
      }

      .brand small {
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0.14em;
      }

      .me {
        margin-top: 26px;
        padding: 14px;
        border: 1px solid var(--line);
        background: #ffffff09;
      }

      .me .label {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.15em;
        font-weight: 800;
      }

      .me .name {
        margin-top: 7px;
        font-size: 17px;
        font-weight: 900;
        letter-spacing: -0.02em;
        word-break: break-all;
      }

      .me button {
        margin-top: 12px;
        width: 100%;
      }

      /* 조작키 안내 — 게임 로드아웃 화면과 같은 내용 */
      .controls-panel {
        margin-top: 22px;
      }

      .controls-panel .label {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.15em;
        font-weight: 800;
      }

      .controls-panel ul {
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .controls-panel li {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .controls-panel b {
        color: #b9cbd1;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      /* 방 만들기 버튼은 왼쪽 하단 고정 */
      .sidebar-bottom {
        margin-top: auto;
      }

      .sidebar-bottom .primary-button {
        width: 100%;
      }

      /* ---------- 오른쪽 방 목록 ---------- */

      .content {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 26px 30px 24px;
      }

      /* 머리글은 고정 — 스크롤되는 건 목록뿐이다. */
      .content-head,
      .list-head {
        flex: none;
      }

      .content-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .content-head h2 {
        margin: 6px 0 0;
        font-size: 30px;
        letter-spacing: -0.04em;
      }

      .head-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .room-count {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.14em;
      }

      .room-count b {
        color: var(--cyan);
      }

      .list-head,
      .room-row {
        display: grid;
        grid-template-columns: 1fr 160px 110px;
        gap: 16px;
        align-items: center;
      }

      .list-head {
        padding: 0 18px 9px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.15em;
        font-weight: 800;
      }

      .list-head span:last-child,
      .room-row .count {
        text-align: right;
      }

      .room-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 10px 0 4px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* 스크롤은 되지만 스크롤바는 숨긴다. */
      .sidebar,
      .room-list {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .sidebar::-webkit-scrollbar,
      .room-list::-webkit-scrollbar {
        display: none;
      }

      .room-row {
        width: 100%;
        padding: 16px 18px;
        border: 1px solid var(--line);
        color: var(--ink);
        background: #ffffff09;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: 0.18s ease;
      }

      .room-row:hover:not(.full),
      .room-row:focus-visible {
        border-color: var(--cyan);
        background: #6de6df1f;
        transform: translateY(-2px);
        outline: none;
      }

      .room-row .title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 마우스를 올리면 방 제목 → "방 참여하기" */
      .room-row .title .join-label {
        display: none;
        color: var(--cyan);
        letter-spacing: 0.12em;
      }

      .room-row:hover:not(.full) .title .room-title,
      .room-row:focus-visible:not(.full) .title .room-title {
        display: none;
      }

      .room-row:hover:not(.full) .title .join-label,
      .room-row:focus-visible:not(.full) .title .join-label {
        display: inline;
      }

      /* 비밀번호 방 자물쇠 */
      .room-row .lock {
        margin-right: 7px;
        color: var(--flash);
        font-size: 12px;
      }

      .room-row:hover:not(.full) .title .lock {
        display: none;
      }

      .room-row .host {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.06em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .room-row .host b {
        color: #b9cbd1;
        font-weight: 800;
      }

      .room-row .count {
        font-size: 14px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      .room-row .count .now {
        color: var(--cyan);
      }

      .room-row .count .slash {
        margin: 0 3px;
        color: #4e6872;
      }

      /* 정원이 찬 방 */
      .room-row.full {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .room-row.full .count .now {
        color: var(--red);
      }

      .empty {
        display: grid;
        place-content: center;
        gap: 10px;
        height: 100%;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      .empty .mark {
        color: #2c4048;
        font-size: 44px;
      }

      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
        }
        .sidebar {
          order: 2;
          flex-direction: row;
          align-items: center;
          gap: 12px;
          padding: 12px 16px;
          border-right: 0;
          border-top: 1px solid var(--line);
        }
        .brand,
        .me .label,
        .me button,
        .controls-panel {
          display: none;
        }
        .me {
          margin: 0;
          padding: 8px 12px;
        }
        .me .name {
          margin: 0;
          font-size: 13px;
        }
        .sidebar-bottom {
          flex: 1;
        }
        .content {
          order: 1;
          padding: 18px 16px 8px;
        }
        .list-head,
        .room-row {
          grid-template-columns: 1fr 92px;
        }
        .list-head span:nth-child(2),
        .room-row .host {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <!-- 왼쪽: 내 정보 + 하단 방 만들기 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">✦</span><span>BREACHLINE</span><small>LOBBY</small>
        </div>

        <div class="me">
          <div class="label">MY CALLSIGN</div>
          <div class="name" id="my-nickname">—</div>
          <button id="change-nickname" class="ghost-button" type="button">닉네임 변경</button>
        </div>

        <div class="controls-panel">
          <div class="label">CONTROLS</div>
          <ul id="controls-list"></ul>
        </div>

        <div class="sidebar-bottom">
          <button id="create-room" class="primary-button" type="button">
            방 만들기 <span>+</span>
          </button>
        </div>
      </aside>

      <!-- 오른쪽: 방 목록 -->
      <main class="content">
        <div class="content-head">
          <div>
            <div class="eyebrow">FIND A MATCH</div>
            <h2>방 찾기</h2>
          </div>
          <div class="head-actions">
            <div class="room-count"><b id="room-count">0</b> ROOMS</div>
            <button id="refresh" class="ghost-button" type="button">새로고침</button>
          </div>
        </div>

        <div class="list-head">
          <span>방 제목</span><span>방장</span><span>참여 / 정원</span>
        </div>

        <div class="room-list" id="room-list"></div>
      </main>
    </div>

    <!-- 방 만들기 모달 -->
    <div id="create-modal" class="modal-backdrop hidden">
      <section class="screen-card modal">
        <div class="eyebrow">NEW ROOM</div>
        <h2>방 만들기</h2>
        <form id="create-form" novalidate>
          <div class="form-row">
            <label for="room-title">방 제목</label>
            <input
              id="room-title"
              class="field"
              type="text"
              maxlength="20"
              placeholder="예) 2대2 한판 하실분"
              autocomplete="off"
            />
          </div>
          <div class="form-row">
            <label for="room-password">비밀번호 <span class="optional">(숫자 4자리 · 비워두면 공개방)</span></label>
            <input
              id="room-password"
              class="field pin"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              placeholder="0000"
              autocomplete="off"
            />
          </div>
          <div class="form-row">
            <label for="room-capacity">정원</label>
            <div class="segmented" id="room-capacity">
              <button type="button" data-capacity="2">2 인</button>
              <button type="button" data-capacity="4" class="selected">4 인</button>
            </div>
          </div>
          <p id="create-error" class="field-error" role="alert"></p>
          <div class="modal-actions">
            <button id="create-cancel" class="ghost-button" type="button">취소</button>
            <button class="primary-button" type="submit">만들기 <span>↗</span></button>
          </div>
        </form>
      </section>
    </div>

    <!-- 잠긴 방 참여 시 비밀번호 입력 -->
    <div id="pw-modal" class="modal-backdrop hidden">
      <section class="screen-card modal">
        <div class="eyebrow">LOCKED ROOM</div>
        <h2 id="pw-room-title">비밀번호 입력</h2>
        <form id="pw-form" novalidate>
          <div class="form-row">
            <label for="pw-input">비밀번호 (숫자 4자리)</label>
            <input
              id="pw-input"
              class="field pin"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              placeholder="0000"
              autocomplete="off"
            />
          </div>
          <p id="pw-error" class="field-error" role="alert"></p>
          <div class="modal-actions">
            <button id="pw-cancel" class="ghost-button" type="button">취소</button>
            <button class="primary-button" type="submit">참여 <span>↗</span></button>
          </div>
        </form>
      </section>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script type="module">
      import {
        CONTROLS,
        checkPassword,
        createRoom,
        findRoom,
        hasPassword,
        joinRoom,
        loadRooms,
        playerCount,
        requireNickname,
        toast,
        validatePassword,
      } from "./store.js";

      const nickname = requireNickname();
      if (nickname) {
        document.getElementById("my-nickname").textContent = nickname;
      }

      const controlsList = document.getElementById("controls-list");
      for (const [key, action] of CONTROLS) {
        const li = document.createElement("li");
        const b = document.createElement("b");
        b.textContent = key;
        const span = document.createElement("span");
        span.textContent = action;
        li.append(b, span);
        controlsList.appendChild(li);
      }

      const listEl = document.getElementById("room-list");
      const countEl = document.getElementById("room-count");

      function render() {
        const rooms = loadRooms();
        countEl.textContent = rooms.length;
        listEl.innerHTML = "";

        if (rooms.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML =
            '<div class="mark">✦</div><div>열려 있는 방이 없습니다<br />왼쪽 아래에서 방을 만들어 보세요</div>';
          listEl.appendChild(empty);
          return;
        }

        for (const room of rooms) {
          const players = playerCount(room);
          const full = players >= room.capacity;
          const row = document.createElement("button");
          row.type = "button";
          row.className = full ? "room-row full" : "room-row";
          row.dataset.id = room.id;
          if (full) row.disabled = true;

          const title = document.createElement("div");
          title.className = "title";
          if (hasPassword(room)) {
            const lock = document.createElement("span");
            lock.className = "lock";
            lock.textContent = "🔒";
            lock.title = "비밀번호가 있는 방";
            title.appendChild(lock);
          }
          const name = document.createElement("span");
          name.className = "room-title";
          name.textContent = room.title;
          const join = document.createElement("span");
          join.className = "join-label";
          join.textContent = hasPassword(room) ? "🔒 방 참여하기" : "▶ 방 참여하기";
          title.append(name, join);

          const host = document.createElement("div");
          host.className = "host";
          host.innerHTML = "방장 <b></b>";
          host.querySelector("b").textContent = room.host;

          const count = document.createElement("div");
          count.className = "count";
          count.innerHTML =
            '<span class="now"></span><span class="slash">/</span><span class="cap"></span>';
          count.querySelector(".now").textContent = players;
          count.querySelector(".cap").textContent = room.capacity;

          row.append(title, host, count);
          listEl.appendChild(row);
        }
      }

      /** 참여 처리. 잠긴 방이면 비밀번호를 먼저 확인한다. */
      function enterRoom(roomId) {
        const room = joinRoom(roomId, nickname);
        if (!room) {
          toast("정원이 가득 찬 방입니다.");
          render();
          return;
        }
        location.href = `room.html?id=${encodeURIComponent(room.id)}`;
      }

      listEl.addEventListener("click", (event) => {
        const row = event.target.closest(".room-row");
        if (!row || row.disabled) return;

        const room = findRoom(row.dataset.id);
        if (!room) {
          render();
          return;
        }
        if (hasPassword(room)) {
          openPasswordModal(room);
          return;
        }
        enterRoom(room.id);
      });

      document.getElementById("refresh").addEventListener("click", () => {
        render();
        toast("방 목록을 새로고침했습니다.");
      });

      document.getElementById("change-nickname").addEventListener("click", () => {
        location.href = "index.html";
      });

      /* ---------- 방 만들기 모달 ---------- */

      const modal = document.getElementById("create-modal");
      const createForm = document.getElementById("create-form");
      const titleInput = document.getElementById("room-title");
      const createError = document.getElementById("create-error");
      const passwordInput = document.getElementById("room-password");
      const capacityGroup = document.getElementById("room-capacity");

      /** 숫자만 남긴다. */
      const digitsOnly = (input) => {
        input.value = input.value.replace(/\D/g, "").slice(0, 4);
      };

      function openModal() {
        modal.classList.remove("hidden");
        createError.textContent = "";
        titleInput.value = "";
        passwordInput.value = "";
        titleInput.focus();
      }

      function closeModal() {
        modal.classList.add("hidden");
      }

      document.getElementById("create-room").addEventListener("click", openModal);
      document.getElementById("create-cancel").addEventListener("click", closeModal);

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        closeModal();
        closePasswordModal();
      });

      capacityGroup.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-capacity]");
        if (!button) return;
        for (const b of capacityGroup.children) b.classList.remove("selected");
        button.classList.add("selected");
      });

      titleInput.addEventListener("input", () => {
        createError.textContent = "";
      });

      passwordInput.addEventListener("input", () => {
        digitsOnly(passwordInput);
        createError.textContent = "";
      });

      createForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) {
          createError.textContent = "방 제목을 입력하세요.";
          titleInput.focus();
          return;
        }
        // 비워두면 공개방, 적으면 숫자 4자리여야 한다.
        const password = validatePassword(passwordInput.value);
        if (!password.ok) {
          createError.textContent = password.message;
          passwordInput.focus();
          return;
        }
        const capacity = Number(
          capacityGroup.querySelector(".selected").dataset.capacity
        );
        const room = createRoom({
          title,
          host: nickname,
          capacity,
          password: password.value,
        });
        closeModal();
        // 방을 만든 사람은 곧바로 방 안(방장)으로 들어간다.
        joinRoom(room.id, nickname);
        location.href = `room.html?id=${encodeURIComponent(room.id)}`;
      });

      /* ---------- 잠긴 방 비밀번호 입력 ---------- */

      const pwModal = document.getElementById("pw-modal");
      const pwForm = document.getElementById("pw-form");
      const pwInput = document.getElementById("pw-input");
      const pwError = document.getElementById("pw-error");
      let pendingRoomId = null;

      function openPasswordModal(room) {
        pendingRoomId = room.id;
        document.getElementById("pw-room-title").textContent = room.title;
        pwInput.value = "";
        pwError.textContent = "";
        pwModal.classList.remove("hidden");
        pwInput.focus();
      }

      function closePasswordModal() {
        pwModal.classList.add("hidden");
        pendingRoomId = null;
      }

      pwInput.addEventListener("input", () => {
        digitsOnly(pwInput);
        pwError.textContent = "";
      });

      pwForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const room = findRoom(pendingRoomId);
        if (!room) {
          closePasswordModal();
          render();
          return;
        }
        if (!checkPassword(room, pwInput.value)) {
          pwError.textContent = "비밀번호가 맞지 않습니다.";
          pwInput.value = "";
          pwInput.focus();
          return;
        }
        const id = room.id;
        closePasswordModal();
        enterRoom(id);
      });

      document.getElementById("pw-cancel").addEventListener("click", closePasswordModal);

      pwModal.addEventListener("click", (event) => {
        if (event.target === pwModal) closePasswordModal();
      });

      render();
    </script>
  </body>
</html>
