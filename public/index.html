<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111c" />
    <title>Visual Shooting Code — 로비 입장</title>
    <link rel="icon" href="./Asset/logo.png" />
    <link rel="stylesheet" href="./ui/ui.css" />
  </head>
  <body class="landing-page">
    <main class="landing-shell">
      <section class="landing-copy" aria-labelledby="game-title">
        <p class="eyebrow">Visual Shooting Code</p>
        <h1 id="game-title" class="tactical-title">
          <img class="title-logo" src="./Asset/logo.png" alt="" />
          <span class="wordmark"><span class="wordmark-cut">vs<b>code</b></span></span>
        </h1>
        <p class="title-slate" aria-hidden="true">
          <span>TACTICAL ARENA</span><i></i><span>2 VS 2</span><i></i><span>10 OPERATORS</span>
        </p>
        <p class="landing-description">
          팀을 만들고 캐릭터를 선택한 뒤 전장에 합류하세요.
          빠르게 움직이고, 협력하고, 끝까지 살아남으세요.
        </p>
        <div class="feature-strip" aria-label="게임 특징">
          <span>실시간 전투</span>
          <span>팀 로비</span>
          <span>캐릭터 선택</span>
        </div>
      </section>

      <section class="auth-card" aria-labelledby="nickname-title">
        <div class="card-accent"></div>
        <p class="eyebrow">IDENTITY REQUIRED</p>
        <h2 id="nickname-title">작전명 입력</h2>
        <p>로비에서 사용할 닉네임을 입력하세요.</p>

        <form id="nickname-form" novalidate>
          <label for="nickname-input">닉네임</label>
          <input id="nickname-input" name="nickname" type="text" maxlength="12"
            autocomplete="nickname" placeholder="2~12자" />
          <p id="nickname-error" class="form-error" aria-live="polite"></p>
          <button type="submit" class="primary-button">로비 입장</button>
        </form>

        <p class="direct-play">
          로비 없이 확인하려면 <a href="./game.html">게임 화면 바로 열기</a>
        </p>
      </section>
    </main>

    <script type="module" src="./landing.js"></script>
  </body>
</html>
